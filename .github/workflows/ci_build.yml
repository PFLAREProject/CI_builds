name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  # run on the 1st of the month for new petsc release
  schedule:
    - cron: '0 0 1 * *'    

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:    

jobs:
  setup:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3         

  build_petsc:
    runs-on: ubuntu-22.04
    needs: setup
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}      
      - name: Build Docker image for pull requests
        uses: docker/build-push-action@v2
        with:
          platforms: linux/amd64
          push: true
          file: Dockerfile_petsc
          tags: stevendargaville/petsc:latest

  build_petsc_64_bit:
    runs-on: ubuntu-22.04
    needs: [setup, build_petsc]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}      
      - name: Build Docker image for pull requests
        uses: docker/build-push-action@v2
        with:
          platforms: linux/amd64
          push: true
          file: Dockerfile_petsc_64_bit
          tags: stevendargaville/petsc_64_bit:latest        
          
  build_petsc_intel:
    runs-on: ubuntu-22.04
    needs: setup
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}      
      - name: Build Docker image for pull requests
        uses: docker/build-push-action@v2
        with:
          platforms: linux/amd64
          push: true
          file: Dockerfile_petsc_intel
          tags: stevendargaville/petsc_intel:latest      
          
  build_petsc_kokkos:
    runs-on: ubuntu-22.04
    needs: setup
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}      
      - name: Build Docker image for pull requests
        uses: docker/build-push-action@v2
        with:
          platforms: linux/amd64
          push: true
          file: Dockerfile_petsc_kokkos
          tags: stevendargaville/petsc_kokkos:latest

  # CUDA image is large and slow to build; only rebuild it when its Dockerfile
  # changes, on the monthly cron, or when manually dispatched.
  build_petsc_kokkos_cuda:
    runs-on: ubuntu-22.04
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # need history to diff against the previous push
          fetch-depth: 0
      - name: Check whether the CUDA Dockerfile changed
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" ${{ github.sha }} | grep -q '^Dockerfile_petsc_kokkos_cuda$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # The nvidia/cuda devel base is several GB and the free runner has ~14GB
      # of disk, so drop the preinstalled toolchains we do not need
      - name: Free disk space on the runner
        if: steps.changed.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Login to Docker Hub
        if: steps.changed.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker image for pull requests
        if: steps.changed.outputs.run == 'true'
        uses: docker/build-push-action@v2
        with:
          platforms: linux/amd64
          push: true
          file: Dockerfile_petsc_kokkos_cuda
          tags: stevendargaville/petsc_kokkos_cuda:latest

  build_petsc_no_mpi:
    runs-on: ubuntu-22.04
    needs: setup
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker image for pull requests
        uses: docker/build-push-action@v2
        with:
          platforms: linux/amd64
          push: true
          file: Dockerfile_petsc_no_mpi
          tags: stevendargaville/petsc_no_mpi:latest

  build_petsc_spack:
    runs-on: ubuntu-22.04
    needs: setup
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}      
      - name: Build Docker image for pull requests
        uses: docker/build-push-action@v2
        with:
          platforms: linux/amd64
          push: true
          file: Dockerfile_petsc_spack
          tags: stevendargaville/petsc_spack:latest